spring.application.name=smart-watchlist

# H2 in-memory DB - zero setup, resets on restart (fine for a hackathon demo).
# Swap to Postgres by changing these 4 lines + adding the postgres driver
# if you want data to survive restarts.
spring.datasource.url=jdbc:h2:mem:watchlistdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Handy for poking at the DB during the demo: localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
logging.level.com.groww.watchlist=INFO
